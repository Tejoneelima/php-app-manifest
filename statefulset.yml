---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
spec:
  serviceName: mysqldb
  
  replicas: 1
  selector:
    matchLabels:
      app: app-database
  template:
    metadata:
      labels:
        app: app-database
    spec:
      containers:
        - name: dbcont
          image: tejoneelima/phpapp:dbimage
          ports:
            - containerPort: 3306

        #secret Integration
          envFrom:
            - secretRef:
                name: bankapp-db-secret

        #Resource Quota
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
  
          volumeMounts:
            - name: mysql-data
              mountPath: /usr/share/nginx/html/

    volumeClaimTemplates:
      - metadata:
          name: mysql-data
         spec:
           accessModes:
            - ReadwriteOnce
          storageClassName: gp2
          resources:
            requests:
              storage: 2Gi
        
